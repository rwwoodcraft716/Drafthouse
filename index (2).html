<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftHouse</title><style>body{background:#101713;color:#eee;font:16px system-ui;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{color:#a3e635;margin-bottom:0}small{color:#aab7ae}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #536057;background:#202b23;color:white}button{cursor:pointer}button.active,.primary{background:#a3e635;color:#152014;font-weight:bold}nav{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}.panel{background:#1c2720;padding:15px;border-radius:12px;margin:12px 0}.line{display:flex;align-items:center;gap:8px;border-bottom:1px solid #354238;padding:12px 0}.grow{flex:1}label{display:block;margin:10px 0}input{max-width:95%;box-sizing:border-box}button:disabled{opacity:.4}h2{font-size:20px} .orange{color:#ff8b40}.avatar-art{display:inline-flex;width:42px;height:46px;vertical-align:middle;flex-shrink:0}.avatar-art svg{width:100%;height:100%}.avatar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.avatar-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 3px;min-width:0}.avatar-option .avatar-art{width:68px;height:75px}.avatar-option small{font-size:11px;color:inherit}.avatar-option.active{outline:2px solid #a3e635;outline-offset:1px}.avatar-option{background:linear-gradient(145deg,#26332c,#141c18);border-color:#3a4b40;min-height:125px;justify-content:center}.avatar-option .avatar-art{width:85px;height:94px}.avatar-option small{font-weight:800;text-align:center;line-height:1.15}.avatar-option.active{background:#35472b;color:#e9ffc9}.avatar-option:hover{border-color:#a3e635}</style><main><h1>🔥 DRAFT<span class="orange">HOUSE</span></h1><small>Southside Edition • Multiplayer beta • Virtual credits only</small><nav id="nav"></nav><div id="app"></div><p><small>Independent recreational workload prediction game. No money, patient details or Z" fill="currentColor" opacity=".16"/><g fill="currentColor" stroke="#101820" stroke-width="1.8" stroke-linejoin="round">${mascotArt[a[0]]}</g><path d="m35 76 5 4 5-4" fill="none" stroke="currentColor"/></svg></span>`}function chooseAvatar(id){avatarChoice=id;document.querySelectorAll("[data-avatar]").forEach(b=>{b.classList.toggle("active",b.dataset.avatar===id);b.setAttribute("aria-pressed",b.dataset.avatar===id)})}function changeAvatar(){s.players[s.who].avatar=avatarChoice;render()}
const defaults=[['Engine 25',5.5,-102,-118],['Ladder 10',2.5,105,-125],['Battalion 46',2.5,140,-165],['Hot Momma — AF',0.5,-150,125],['Sleep Killer',1.5,170,-200],['False Prophet',0.5,-115,-105]];let s;try{s=JSON.parse(localStorage.getItem('draftHouseV1'))}catch{};s=s||{players:[{name:'The Commissioner',avatar:'commissioner',credits:1000}],who:0,lines:defaults.map(x=>({name:x[0],line:x[1],over:x[2],under:x[3]})),slips:[],locked:false,tour:1};let tab='Board',picks={};const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{},fmt=x=>x>0?'+'+x:x,dec=x=>x>0?1+x/100:1+100/Math.abs(x);function go(t){tab=t;render()}function render(){save();let p=s.players[s.who];$('nav').innerHTML=['Board','My Picks','Rankings','Profile',...(admin?['Commissioner']:[])].map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let h=`<div class="panel">${avatarArt(p.avatar)} ${esc(p.name)} <b style="float:right">${p.credits.toFixed(2)} credits</b><br><small>Tour ${s.tour} • ${s.locked?'Locked':'Open'}</small></div>`;if(tab==='Board'){h+=s.lines.map((l,i)=>`<div class="line"><b class="grow">${esc(l.name)}</b>${['over','under'].map(k=>`<button ${s.locked?'disabled':''} class="${picks[i]===k?'active':''}" onclick="pick(${i},'${k}')">${k==='over'?'O':'U'} ${l.line}<br>${fmt(l[k])}</button>`).join('')}</div>`).join('');h+=`<div class="panel"><b>${Object.keys(picks).length} selections</b><p>Singles or illustrative parlay</p><input id="stake" type="number" min="1" value="25" oninput="quote()"><p id="quote"></p><button class="primary" onclick="place()" ${s.locked?'disabled':''}>Submit virtual pick</button></div>`}if(tab==='My Picks')h+=s.slips.filter(x=>x.player===s.who).map(x=>`<div class="panel">Tour ${x.tour} • ${esc(x.status)}<p>${x.legs.map(l=>esc(l.name)+' '+l.side+' '+l.line).join('<br>')}</p>Stake ${x.stake} • Potential return ${x.ret.toFixed(2)}</div>`).join('')||'<p>No picks yet.</p>';if(tab==='Rankings')h+=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.credits-a.credits).map((p,i)=>`<div class="line"><b>${i+1}</b><span class="grow">${avatarArt(p.avatar)} ${esc(p.name)}</span>${p.credits.toFixed(2)}</div>`).join('');if(tab==='Profile')h+=`<div class="panel"><h2>Player profile</h2><select onchange="s.who=+this.value;picks={};render()">${s.players.map((p,i)=>`<option value="${i}" ${i===s.who?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>New nickname <input id="nick" maxlength="32"></label><label>Choose your badge</label><div class="avatar-grid">${avatars.map(a=>`<button type="button" data-avatar="${a[0]}" aria-pressed="${avatarChoice===a[0]}" class="avatar-option ${avatarChoice===a[0]?'active':''}" onclick="chooseAvatar('${a[0]}')">${avatarArt(a[0])}<small>${a[1]}</small></button>`).join('')}</div><p><button onclick="changeAvatar()">Update my avatar</button></p><button onclick="join()">Create local player</button></div>`;if(tab==='Commissioner')h+=`<div class="panel"><h2>Commissioner's office</h2><small>Authorized Commissioner controls.</small><p><button onclick="act('lock')">Lock tour</button></p>${!s.locked&&!s.slips.some(x=>x.tour===s.tour)?`<h2>Customize lines</h2>${s.lines.map((l,i)=>`<label>${esc(l.name)} <input id="l${i}" type="number" step="0.5" value="${l.line}"><input id="o${i}" type="number" value="${l.over}"><input id="u${i}" type="number" value="${l.under}"></label>`).join('')}<button onclick="update()">Save lines</button><h2>Custom prop</h2><input id="custom" placeholder="Anonymous workload prop"><button onclick="add()">Add prop</button>`:''}${s.locked?`<h2>Settle tour</h2>${s.lines.map((l,i)=>`<label>${esc(l.name)} <input id="r${i}" type="number" min="0" step="1" placeholder="Final count"></label>`).join('')}<button onclick="settle()">Settle and open next tour</button>`:''}</div>`;$('app').innerHTML=h;if(tab==='Board')quote()}
function pick(i,k){if(s.locked)return;if(picks[i]===k)delete picks[i];else picks[i]=k;render()}function legs(){return Object.entries(picks).map(([i,k])=>({i:+i,name:s.lines[i].name,line:s.lines[i].line,side:k,odds:s.lines[i][k]}))}function quote(){let a=legs(),v=+$('stake').value;$('quote').textContent='Illustrative return: '+(a.length&&v>0?v*a.reduce((x,l)=>x*dec(l.odds),1):0).toFixed(2)+' credits'}function place(){let a=legs(),v=+$('stake').value,p=s.players[s.who];if(s.locked||!a.length||!Number.isFinite(v)||v<=0||v>p.credits)return alert('Check selections and balance.');let ret=v*a.reduce((x,l)=>x*dec(l.odds),1);p.credits-=v;s.slips.push({player:s.who,tour:s.tour,legs:a,stake:v,ret,status:'Pending'});picks={};go('My Picks')}function join(){let n=$('nick').value.trim();if(!n||s.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Choose a unique nickname');s.players.push({name:n,avatar:avatarChoice,credits:1000});s.who=s.players.length-1;picks={};render()}function update(){let a=s.lines.map((l,i)=>({...l,line:+$('l'+i).value,over:+$('o'+i).value,under:+$('u'+i).value}));if(a.some(l=>!Number.isFinite(l.line)||l.line<0||l.line%1!==.5||[l.over,l.under].some(o=>!Number.isFinite(o)||Math.abs(o)<100)))return alert('Use nonnegative half-point lines and odds of at least ±100.');s.lines=a;render()}function add(){let n=$('custom').value.trim();if(!n)return;s.lines.push({name:n.slice(0,60),line:.5,over:-110,under:-110});render()}function settle(){let a=s.lines.map((l,i)=>$('r'+i).value);if(a.some(x=>x===''||!Number.isInteger(+x)||+x<0))return alert('Enter all final counts.');for(let x of s.slips.filter(x=>x.tour===s.tour&&x.status==='Pending')){let win=x.legs.every(l=>l.side==='over'?+a[l.i]>l.line:+a[l.i]<l.line);x.status=win?'Won':'Lost';if(win)s.players[x.player].credits+=x.ret} s.tour++;s.locked=false;render()}
const db=supabase.createClient('https://nzlthfwvryppxowdwjav.supabase.co','sb_publishable_kWDEGI_TsirBsZ3Qh2bbiA_gEm0OvBP');let admin=false,uid=null,busy=false;
function showLogin(){ $('nav').innerHTML=''; $('app').innerHTML=`<div class="panel"><h2>Sign in or create account</h2><label>Email <input id="email" type="email"></label><label>Password <input id="pw" type="password" minlength="8"></label><button onclick="login(false)">Sign in</button> <button onclick="login(true)">Create account</button></div>`;}
async function login(create){let email=$('email').value.trim(),password=$('pw').value;let r=await (create?db.auth.signUp({email,password}):db.auth.signInWithPassword({email,password}));if(r.error)return alert(r.error.message);if(!r.data.session)return alert('Check your email to confirm your account, then sign in.');await act('read');}
async function act(action,payload={}){if(busy)return;busy=true;try{let {data:d,error}=await db.rpc('dh_action',{action,payload});if(error)throw error;uid=d.uid;admin=d.admin;let who=d.players.findIndex(p=>p.id===uid);if(who<0){$('nav').innerHTML='';$('app').innerHTML=`<div class="panel"><h2>Choose your nickname and badge</h2><input id="nick" maxlength="32"><div class="avatar-grid">${avatars.map(a=>`<button data-avatar="${a[0]}" onclick="chooseAvatar('${a[0]}')">${avatarArt(a[0])}<small>${a[1]}</small></button>`).join('')}</div><button onclick="join()">Join DraftHouse</button></div>`;return;}s={players:d.players.map(p=>({...p,credits:Number(p.credits)})),who,lines:d.board.lines,tour:d.board.tour,locked:d.board.locked,slips:d.slips.map(x=>({...x,player:who,ret:Number(x.ret)}))};if(action!=='read')picks={};if(action==='place')tab='My Picks';if(tab==='Commissioner'&&!admin)tab='Board';render();if(tab==='Profile')$('app').innerHTML=`<div class="panel"><h2>${esc(s.players[s.who].name)}</h2><div class="avatar-grid">${avatars.map(a=>`<button data-avatar="${a[0]}" onclick="chooseAvatar('${a[0]}')">${avatarArt(a[0])}<small>${a[1]}</small></button>`).join('')}</div><button onclick="changeAvatar()">Update avatar</button> <button onclick="logout()">Sign out</button></div>`;$('nav').insertAdjacentHTML('beforeend','<button onclick="act(\'read\')">Refresh</button>');}catch(e){alert(e.message||String(e));}finally{busy=false;}}
function go(t){tab=t;act('read')}function join(){act('join',{name:$('nick').value.trim(),avatar:avatarChoice})}function changeAvatar(){act('avatar',{avatar:avatarChoice})}function place(){act('place',{tour:s.tour,stake:Number($('stake').value),legs:legs()})}function update(){act('lines',{lines:s.lines.map((l,i)=>({...l,line:+$('l'+i).value,over:+$('o'+i).value,under:+$('u'+i).value}))})}function add(){let n=$('custom').value.trim();if(n)act('lines',{lines:[...s.lines,{name:n.slice(0,60),line:.5,over:-110,under:-110}]})}function settle(){let counts=s.lines.map((l,i)=>$('r'+i).value);if(counts.some(x=>x===''))return alert('Enter every count');act('settle',{counts:counts.map(Number)})}async function logout(){await db.auth.signOut();showLogin()}
