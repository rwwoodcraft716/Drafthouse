*{box-sizing:border-box}body{margin:0;background:#101419;color:#e7edf1;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}header{text-align:center;margin:12px 0 24px}h1{font-size:clamp(34px,8vw,56px);font-style:italic;letter-spacing:-2px;margin:0}h1 span,.green{color:#a3c86a}header small{letter-spacing:3px}button,input,select,textarea{font:inherit;color:inherit;background:#151c22;border:1px solid #47545e;border-radius:8px;padding:10px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.active,.primary{background:#a3c86a;color:#14200c;font-weight:800}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.panel{background:#202932;border-radius:12px;padding:15px;margin:10px 0}.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px}.odds button{color:#a3c86a}.odds button.active{color:#14200c}.odds strong{display:block;font-size:23px}small,p.muted{color:#b8c6d1}h2,h3{margin:8px 0}input[type=range]{width:100%;accent-color:#a3c86a;padding:0}label{display:block;margin:8px 0}.wide{width:100%}.slip{border:1px solid #a3c86a}hr{border:0;border-top:1px solid #43515b}footer{text-align:center;margin:24px 0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles button{min-height:70px}.err{color:#ffb5a6;white-space:pre-wrap}a{color:#a3c86a}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tabs button{padding:9px 2px;font-size:14px} .avatar{font-size:32px}.notice{border:1px solid #58644c;padding:10px;border-radius:8px} </style><main><header><h1>DRAFT<span>HOUSE</span></h1><small>FIREHOUSE FANTASY</small><p class="green">— SOUTHSIDE EDITION —</p></header><nav id="nav"></nav><p id="error" class="err" role="alert"></p><div id="app"></div><footer><button onclick="about()">About DraftHouse</button> <button onclick="rules()">House Rules</button><p><small>© 2026 DraftHouse • Virtual credits only • V2 staging</small></p></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';const db=supabase.createClient('https://nzlthfwvryppxowdwjav.supabase.co','sb_publishable_kWDEGI_TsirBsZ3Qh2bbiA_gEm0OvBP');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n>0?'+'+n:String(n),money=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});let d=null,page='Home',cat='Company',picks={},lines={},stake='100',busy=false,requestId=null;const avatars=[['commissioner','The Commissioner','👑'],['skull','Bone Collector','💀'],['gorilla','Silverback','🦍'],['shark','Loan Shark','🦈'],['pig','War Pig','🐗'],['devil','Hellraiser','👹'],['wolf','Lone Wolf','🐺'],['eagle','The Eagle','🦅'],['dragon','Smoke Eater','🐉'],['cobra','Southside Serpent','🐍'],['bull','The Bull','🐂'],['reaper','Grim Reaper','☠️']];const featured=[['Southside Slam',[[0,11.5,'over'],[1,5.5,'over'],[2,4.5,'over']]],['Sleepless in South Buffalo',[[13,2.5,'over'],[17,null,'over']]],['Retirement Package',[[0,5.5,'under'],[1,2.5,'under'],[2,2.5,'under'],[13,1.5,'under']]],['Sick Day Special',[[0,7.5,'over'],[15,1.5,'over'],[19,null,'over']]],['Midnight Special',[[24,null,'over'],[13,2.5,'over']]],['The Degenerate',[[0,9.5,'over'],[1,4.5,'over'],[2,4.5,'over'],[10,1.5,'over'],[19,null,'over'],[27,null,'over']]]];
function error(e){$('error').textContent=e?.message||String(e||'')}function me(){return d?.players?.find(p=>p.id===d.uid)}function admin(){return d?.owner||d?.deputy}function save(){if(d?.joined)try{localStorage.setItem('dh2:'+d.uid,JSON.stringify({tour:d.board.tour,picks,lines,stake,requestId}))}catch{}}function restore(){try{let a=JSON.parse(localStorage.getItem('dh2:'+d.uid));if(a?.tour===d.board.tour){picks=a.picks||{};lines=a.lines||{};stake=a.stake||'100';requestId=a.requestId||null}}catch{}}function changed(){requestId=null;save()}
async function act(action='read',payload={}){if(busy)return;busy=true;error('');try{let r=await db.rpc('dh2_action',{action,payload});if(r.error)throw r.error;let first=!d?.joined||d.uid!==r.data.uid;d=r.data;if(first&&d.joined)restore();if(action==='place'){picks={};requestId=null;page='My Picks';save()}render();if(d.invite){let url=new URL(location.href);url.search='';url.searchParams.set('invite',d.invite);prompt('Copy this single-use invitation link',url.href)}}catch(e){error(e)}finally{busy=false;let b=$('finalize');if(b)b.disabled=!Object.keys(picks).length||d?.board?.locked}}
function loginScreen(){$('nav').innerHTML='';$('app').innerHTML=`<div class="panel"><h2>Sign in</h2><label>Email<input class="wide" id="email" type="email"></label><label>Password<input class="wide" id="pw" type="password"></label><button class="primary" onclick="login(false)">Sign in</button> <button onclick="login(true)">Create account</button></div>`}async function login(create){try{let r=await (create?db.auth.signUp({email:$('email').value.trim(),password:$('pw').value}):db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value}));if(r.error)throw r.error;if(!r.data.session)return error('Confirm your email, then sign in.');await act()}catch(e){error(e)}}async function logout(){await db.auth.signOut();d=null;picks={};lines={};requestId=null;loginScreen()}
function go(p){page=p;if(p==='Daily Board')cat='Company';render()}function avatarSelect(){return `<select id="avatar">${avatars.map(a=>`<option value="${a[0]}" ${me()?.avatar===a[0]?'selected':''}>${a[2]} ${a[1]}</option>`).join('')}</select>`}function join(){act('join',{name:$('nick').value,avatar:$('avatar').value,code:$('invite').value.trim()||null})}
function render(){if(!d)return loginScreen();if(!d.joined){$('nav').innerHTML='';$('app').innerHTML=`<div class="panel"><h2>Join DraftHouse</h2><label>Invitation code<input class="wide" id="invite" value="${esc(new URLSearchParams(location.search).get('invite'))}"></label><label>Display name<input id="nick" maxlength="32"></label><label>Avatar ${avatarSelect()}</label><button class="primary" onclick="join()">Join</button> <button onclick="logout()">Sign out</button></div>`;return} $('nav').innerHTML=['Home','Daily Board','My Picks','Standings','My Profile'].map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('')+'<button onclick="act()">Refresh</button>';let h=`<div class="row"><button onclick="go('Home')">← BACK</button><span class="grow"></span><strong class="green">${money(me().credits)} CR</strong></div>`;if(page==='Home')h+=`<div class="panel"><h2>Welcome, ${esc(me().name)}</h2><p>Fourth Platoon • Tour ${d.board.tour} • ${d.board.locked?'Closed':'Open'}</p></div><div class="tiles">${['Daily Board','My Picks','Standings','Kitchen Table','Achievements','My Profile'].map(n=>`<button onclick="go('${n}')">${n}</button>`).join('')}</div><div class="panel"><h3>Commissioner's Corner</h3><p>${esc(d.board.announcement)}</p><button ${admin()?'onclick="go(\'Commissioner\')"':'disabled'}>${admin()?'🛡 Control Center':'🔒 Restricted controls'}</button></div>`;else if(page==='Daily Board')h+=board();else if(page==='My Picks')h+=`<h2>My Picks</h2>${d.tickets.slice().reverse().map(t=>`<div class="panel"><strong>Tour ${t.tour} • ${esc(t.status)}</strong>${t.legs.map(l=>`<p>${esc(l.name)} — ${esc(label(l.line,l.side))} (${fmt(l.odds)})</p>`).join('')}<small>Stake ${money(t.stake)} CR • Return ${money(t.ret)} CR</small></div>`).join('')||'<p>No tickets yet.</p>'}`;else if(page==='Standings')h+=`<h2>Standings</h2>${d.players.slice().sort((a,b)=>b.credits-a.credits).map((p,i)=>`<div class="panel row"><strong>${i+1}.</strong><span class="grow">${esc(p.name)}</span><strong class="green">${money(p.credits)} CR</strong></div>`).join('')}`;else if(page==='Kitchen Table')h+=`<h2>Kitchen Table</h2><div class="panel">Welcome to the house. Keep it friendly.</div>${d.chat.slice().reverse().map(c=>`<div class="panel"><strong>${esc(c.nickname)}</strong><p>${esc(c.body)}</p></div>`).join('')}<textarea class="wide" id="message" maxlength="500" placeholder="Message the crew"></textarea><button onclick="act('chat',{body:$('message').value})">Send</button>`;else if(page==='My Profile')h+=`<div class="panel"><h2>${esc(me().name)}</h2>${avatarSelect()} <button onclick="act('avatar',{avatar:$('avatar').value})">Save avatar</button><p><button onclick="logout()">Sign out</button></p></div>`;else if(page==='Achievements')h+=`<h2>Achievements</h2><div class="panel">Achievement tracking is not enabled in this staging build.</div>`;else if(page==='Commissioner'&&admin())h+=controls();else if(page==='About')h+=aboutText;else if(page==='Rules')h+=rulesText;$('app').innerHTML=h;if(page==='Daily Board')renderSlip()}
function label(l,s){return l==null?(s==='over'?'Yes':'No'):(s==='over'?'Over ':'Under ')+Number(l).toFixed(1)}function price(m,l,s){let base=Number(m[s]);if(m.line==null)return base;let p=base<0?Math.abs(base)/(100+Math.abs(base)):100/(100+base),q=Math.max(.01,Math.min(.99,1/(1+Math.exp(-Math.log(p/(1-p))+(s==='over'?.48:-.48)*(l-m.line)))));return q>=.5?-Math.round(100*q/(1-q)):Math.round(100*(1-q)/q)}function current(m){return lines[m.id]??m.line}function board(){return `<h2>Daily Board</h2><p class="muted">Tour ${d.board.tour} • ${d.board.locked?'Closed':'Open'}</p><div class="tabs">${['Company','Tour','House','Featured'].map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div id="markets">${cat==='Featured'?featured.map((f,i)=>`<div class="panel"><h3>${esc(f[0])}</h3>${f[1].map(([j,l,s])=>`<p>${esc(d.board.lines[j].name)} — ${label(l,s)}</p>`).join('')}<button onclick="addFeatured(${i})" ${d.board.locked?'disabled':''}>Load selections</button></div>`).join(''):d.board.lines.filter(m=>m.category===cat).map(m=>market(m)).join('')}</div><div class="panel slip" id="slip"></div>`}function market(m){let l=current(m);return `<div class="panel" id="market${m.id}"><div class="row"><h3 class="grow">${esc(m.name)}</h3><strong class="green" id="line${m.id}">${l==null?'':Number(l).toFixed(1)}</strong></div><p class="muted">${esc(m.description)}</p>${l==null?'':`<input aria-label="${esc(m.name)} alternate line" type="range" min="0.5" max="30.5" step="0.5" value="${l}" oninput="slide(${m.id},this.value)"><small id="hint${m.id}">${hint(l)}</small>`}<div class="odds" id="odds${m.id}">${buttons(m)}</div></div>`}function hint(l){return `Over: ${Math.floor(l)+1}+ • Under: ${Math.ceil(l)-1} or fewer${Number.isInteger(l)?' • Exact total pushes':''}`}function buttons(m){let l=current(m);return ['over','under'].map(s=>`<button ${d.board.locked||m.closed?'disabled':''} class="${picks[m.id]?.side===s?'active':''}" onclick="toggle(${m.id},'${s}')">${label(l,s)}<strong>${fmt(price(m,l,s))}</strong></button>`).join('')}function slide(i,v){let m=d.board.lines[i];lines[i]=Number(v);delete picks[i];changed();$('line'+i).textContent=Number(v).toFixed(1);$('hint'+i).textContent=hint(Number(v));$('odds'+i).innerHTML=buttons(m);renderSlip()}function toggle(i,s){let m=d.board.lines[i];if(picks[i]?.side===s)delete picks[i];else{if(Object.values(picks).some(x=>x.i!==i&&d.board.lines[x.i].group===m.group))return error('Choose only one market for the same underlying event.');if(!picks[i]&&Object.keys(picks).length>=10)return error('Maximum 10 selections');picks[i]={i,side:s,line:current(m),odds:price(m,current(m),s)}}changed();$('odds'+i).innerHTML=buttons(m);renderSlip()}function remove(i){delete picks[i];changed();if($('odds'+i))$('odds'+i).innerHTML=buttons(d.board.lines[i]);renderSlip()}function addFeatured(i){if(Object.keys(picks).length&&!confirm('Replace your current selections with this featured ticket?'))return;let f=featured[i];if(f[1].some(([j])=>d.board.lines[j].closed))return error('A featured market is closed');picks={};for(let [j,l,s] of f[1]){lines[j]=l;picks[j]={i:j,line:l,side:s,odds:price(d.board.lines[j],l,s)}}changed();renderSlip()}function decimal(){return Object.values(picks).reduce((a,x)=>a*(x.odds>0?1+x.odds/100:1+100/Math.abs(x.odds)),1)}function renderSlip(){if(!$('slip'))return;let a=Object.values(picks);$('slip').innerHTML=`<h2>Live Pick Slip • ${a.length}</h2>${a.map(x=>`<div class="row"><span class="grow">${esc(d.board.lines[x.i].name)}<br><small>${label(x.line,x.side)}</small></span><strong class="green">${fmt(x.odds)}</strong><button aria-label="Remove pick" onclick="remove(${x.i})">×</button></div><hr>`).join('')||'<p>Select odds above to build your ticket.</p>'}<label>Credit amount<input class="wide" type="number" min="1" step="1" id="stake" value="${esc(stake)}" oninput="stake=this.value;changed();totals()"></label><div class="row">${[25,50,100,250].map(n=>`<button onclick="stake='${n}';$('stake').value=stake;changed();totals()">${n}</button>`).join('')}</div><p id="totals"></p><button class="primary wide" id="finalize" onclick="place()" ${!a.length||d.board.locked?'disabled':''}>FINALIZE PICKS</button><button class="wide" onclick="picks={};changed();render()">Clear slip</button>`;totals()}function totals(){let f=decimal(),n=Number(stake)||0,a=Object.keys(picks).length;$('totals').innerHTML=`Combined odds: <strong class="green">${a?fmt(f>=2?Math.round((f-1)*100):Math.round(-100/(f-1))):'—'}</strong><br>Potential profit: ${money(a?n*(f-1):0)} CR<br>Total return: <strong class="green">${money(a?n*f:0)} CR</strong>`}function place(){if(busy||!Object.keys(picks).length)return;if(!confirm('Finalize this ticket for '+stake+' virtual credits?'))return;requestId=requestId||crypto.randomUUID();save();$('finalize').disabled=true;act('place',{id:requestId,tour:d.board.tour,stake:Number(stake),legs:Object.values(picks)})}
function controls(){return `<h2>Commissioner Control Center</h2><div class="panel"><p>${d.owner?'Commissioner':'Deputy'} • Tour ${d.board.tour}</p><button onclick="act('lock')">Lock board</button> <button onclick="if(confirm('Open this tour?'))act('open')">Open board</button> <button onclick="act('invite')">Create invitation</button><label>Announcement<textarea id="announcement" class="wide">${esc(d.board.announcement)}</textarea></label><button onclick="act('announce',{body:$('announcement').value})">Publish</button></div>${d.owner?`<div class="panel"><h3>Deputy access</h3>${d.players.map(p=>`<div class="row"><span class="grow">${esc(p.name)}</span><button onclick="act('deputy',{id:'${esc(p.id)}',enabled:true})">Grant</button><button onclick="act('deputy',{id:'${esc(p.id)}',enabled:false})">Remove</button></div>`).join('')}</div>`:''}<h3>Market controls</h3>${d.board.lines.map(m=>`<div class="panel"><strong>${esc(m.name)}</strong>${m.line==null?'':`<label>Base line<input id="base${m.id}" type="number" min=".5" max="30.5" step=".5" value="${m.line}"></label>`}<label>Over / Yes odds<input id="over${m.id}" type="number" value="${m.over}"></label><label>Under / No odds<input id="under${m.id}" type="number" value="${m.under}"></label><label><input id="closed${m.id}" type="checkbox" ${m.closed?'checked':''}> Closed</label><button onclick="updateMarket(${m.id})">Save market</button></div>`).join('')}<div class="panel"><h3>Settle tour</h3><p>Lock first. Enter counts or 1 for Yes / 0 for No. Enter V to void a market.</p>${d.board.lines.map(m=>`<label>${esc(m.name)} (${m.line==null?'0/1':'count'})<input id="result${m.id}" class="wide"></label>`).join('')}<button onclick="settle()">Settle and advance tour</button></div><h3>Activity log</h3>${d.audit.map(a=>`<p>${esc(a.created)} • ${esc(a.action)}</p>`).join('')}`}function updateMarket(i){act('market',{i,line:$('base'+i)?Number($('base'+i).value):null,over:Number($('over'+i).value),under:Number($('under'+i).value),closed:$('closed'+i).checked})}function settle(){let a=d.board.lines.map(m=>$('result'+m.id).value.trim());if(a.some(x=>!x||(!/^\d+$/.test(x)&&x.toUpperCase()!=='V')))return error('Enter every result or V');if(confirm('Settle all tickets and advance tour?'))act('settle',{results:a.map(x=>x.toUpperCase()==='V'?null:Number(x))})}
const aboutText=`<div class="panel"><h2>About DraftHouse</h2><h3>Independent Platform</h3><p>DraftHouse is an independently developed, private fantasy entertainment platform designed to promote camaraderie and friendly competition among invited members.</p><h3>Affiliation</h3><p>DraftHouse is not affiliated with, sponsored by or endorsed by any fire department, municipality or government agency.</p><h3>Responsible Use</h3><p>Participation must never interfere with professional responsibilities, emergency operations or public safety.</p><h3>Privacy</h3><p>Members are expected to respect confidentiality and refrain from sharing sensitive information.</p><h3>Intellectual Property</h3><p>DraftHouse's original designs, software and proprietary content are protected to the extent permitted by applicable law.</p><p>© 2026 DraftHouse. All rights reserved.</p></div>`;const rulesText=`<div class="panel"><h2>House Rules</h2><h3>The Job Comes First</h3><p>Never let the game interfere with your duties, emergency response or crew safety.</p><h3>Keep It Fair</h3><p>No cheating, manipulating outcomes or submitting picks on events that have already happened.</p><h3>A Ticket Is a Ticket</h3><p>Once finalized, your selections, odds and stake are official.</p><h3>Commissioner's Call</h3><p>The commissioner and deputy handle disputes and verify results.</p><h3>Don't Be That Guy</h3><p>Respect everyone's privacy, keep sensitive information out of the game and keep the trash talk friendly.</p></div>`;function about(){if(d?.joined)go('About');else $('app').innerHTML=aboutText+'<button onclick="loginScreen()">Back to login</button>'}function rules(){if(d?.joined)go('Rules');else $('app').innerHTML=rulesText+'<button onclick="loginScreen()">Back to login</button>'}db.auth.getSession().then(({data,error:e})=>e?error(e):data.session?act():loginScreen());
